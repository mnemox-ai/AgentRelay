[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrelay-protocol"
version = "0.6.0"
description = "Agent Relay — multi-agent coordination layer"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Mnemox AI" }]
readme = "README.md"
keywords = ["ai-agent", "mcp", "microtask", "validation", "multi-agent", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi[standard]>=0.135",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "redis[hiredis]>=5.0",
    "fastmcp>=3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]
lint = [
    "ruff>=0.3",
]
dev = [
    "agent-relay[test,lint]",
]

[project.scripts]
agentrelay = "agentrelay.worker.cli:main"

[project.urls]
Homepage = "https://github.com/mnemox-ai/AgentRelay"
Repository = "https://github.com/mnemox-ai/AgentRelay"
Issues = "https://github.com/mnemox-ai/AgentRelay/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
