databases:
  - name: agentrelay-db
    plan: starter
    databaseName: agentrelay
    user: agentrelay
    postgresMajorVersion: 16

services:
  # ── Redis ──
  - type: redis
    name: agentrelay-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # only internal access

  # ── FastAPI Backend ──
  - type: web
    name: agentrelay-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentrelay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: agentrelay-redis
          type: redis
          property: connectionString
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: '["https://relay.mnemox.ai","https://agentrelay-dashboard.onrender.com","https://relay-api.mnemox.ai","http://localhost:3000"]'
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_REGENERATOR
        value: "true"

  # ── Next.js Dashboard ──
  - type: web
    name: agentrelay-dashboard
    runtime: node
    plan: starter
    region: oregon
    autoDeploy: true
    branch: main
    buildCommand: cd dashboard && npm install && npm run build
    startCommand: cd dashboard && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://agentrelay-api.onrender.com
      - key: PORT
        value: "3000"
