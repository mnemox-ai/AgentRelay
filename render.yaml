databases:
  - name: agentrelay-db
    plan: free
    databaseName: agentrelay
    user: agentrelay

services:
  # ── FastAPI Backend ──
  - type: web
    name: agentrelay-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentrelay-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: '["https://relay.mnemox.ai","https://agentrelay-dashboard.onrender.com","http://localhost:3000"]'
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        value: ""
    healthCheckPath: /health

  # ── Next.js Dashboard ──
  - type: web
    name: agentrelay-dashboard
    runtime: node
    plan: free
    buildCommand: cd dashboard && npm install && npm run build
    startCommand: cd dashboard && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://relay-api.mnemox.ai
      - key: PORT
        value: "3000"
